[package]
name = "ghrg"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GitHub repository governance CLI with Rego-based policy evaluation"
repository = "https://github.com/Shemnei/ghrg"
homepage = "https://github.com/Shemnei/ghrg"
documentation = "https://docs.rs/ghrg"
readme = "../../README.md"
keywords = ["github", "rego", "policy", "governance", "cli"]
categories = ["command-line-utilities", "development-tools"]

[features]
default = []
secret-service = ["dep:keyring"]

[dependencies]
clap.workspace = true
async-trait.workspace = true
chrono.workspace = true
comfy-table.workspace = true
console.workspace = true
csv.workspace = true
dirs.workspace = true
futures.workspace = true
ghrg-core = { path = "../ghrg-core" }
humantime.workspace = true
indicatif.workspace = true
miette.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
keyring = { workspace = true, optional = true, features = ["sync-secret-service", "crypto-rust"] }
