[workspace]
members = ["crates/ghrg-core", "crates/ghrg-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
async-trait = "0.1.89"
chrono = { version = "0.4.44", default-features = false, features = ["clock"] }
clap = { version = "4.6.1", features = ["derive"] }
comfy-table = "7.2.2"
console = "0.16.3"
csv = "1.4.0"
dirs = "6.0.0"
futures = "0.3.32"
globset = "0.4.18"
hex = "0.4.3"
humantime = "2.3.0"
indicatif = "0.18.4"
jsonwebtoken = "10.3.0"
keyring = "3.6.3"
miette = { version = "7.6.0", features = ["fancy"] }
octocrab = "0.49.9"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml = "0.9.34"
sha2 = "0.11.0"
thiserror = "2.0.18"
tokio = { version = "1.52.1", features = ["macros", "rt", "rt-multi-thread"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
uuid = { version = "1.23.1", features = ["v4"] }
regorus = "0.9.1"
